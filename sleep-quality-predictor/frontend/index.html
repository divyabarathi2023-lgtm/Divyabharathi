<!DOCTYPE html>
<html>
<head>
    <title>Sleep Quality Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>😴 Sleep Quality Predictor</h1>

    <input id="sleep" type="number" placeholder="Sleep Hours">
    <input id="stress" type="number" placeholder="Stress Level (1-10)">
    <input id="exercise" type="number" placeholder="Exercise Time (minutes)">

    <button id="predictBtn">Predict Sleep</button>
    <button id="resetBtn">Reset</button>

    <h2 id="result"></h2>
    <p id="message"></p>

    <div id="history"></div>
</div>

</body>

<script src="script.js"></script>
</html>
